name: gcc_check

# Cross-builds ZoneX for the Cortex-R52 with the Arm GNU Toolchain, in every
# configuration, with warnings as errors.
#
# GCC is the project's declared default compiler (CONTRIBUTING.md, "Required
# tooling"), and this is the workflow that holds it to that.  It compiles and links and
# EXECUTES NOTHING -- zx_fvp.yml is what runs the images.  Both exist because
# they fail differently: a change that assembles cleanly and then hangs on the
# first exception passes this workflow and fails that one, and a change that
# only breaks the S32Z280 configuration fails here where no model can catch it.
#
# The S32Z280 lane is build-only and always will be.  It needs silicon, and a
# hosted runner has none.
#
# IT BUILDS THE GUEST IMAGES TOO, which it did not always do.  ZoneX links no
# ThreadX -- at EL2 it is a standalone bare-metal program -- but the examples
# build ThreadX GUEST images, and the ZoneX code inside them is ZoneX's own.
# Without a ThreadX checkout those images are skipped, and the workflow that
# exists to hold this project to its warning set was not looking at several
# thousand lines of it.

on:
  push:
    branches: [ dev, main ]
    paths:
      - ".github/workflows/gcc_check.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "common/**"
      - "core/**"
      - "platform/**"
      - "examples/**"
  pull_request:
    branches: [ dev, main ]
    # Duplicated deliberately; see the note in host_tests.yml.  **Edit both.**
    paths:
      - ".github/workflows/gcc_check.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "common/**"
      - "core/**"
      - "platform/**"
      - "examples/**"

jobs:
  gnu:
    runs-on: ubuntu-24.04

    env:
      # Pinned deliberately, as the runner image is: a toolchain upgrade should
      # be a reviewable commit rather than something that changes underneath
      # the hypervisor.  14.3.rel1 is the version CONTRIBUTING.md names as the
      # reference, and the version ThreadX pins, so the two repositories are
      # comparable.
      # Releases: https://developer.arm.com/downloads/-/arm-gnu-toolchain-downloads
      GCC_VERSION: 14.3.rel1

    steps:
    - name: Check out the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # THE GUEST IMAGES NEED A THREADX CHECKOUT, and without one the example
    # CMakeLists SKIPS them -- with a message, which is right for a
    # contributor who has no kernel sources to hand and wrong here.  Skipped,
    # the ZoneX code that is compiled into a ThreadX image never faced this
    # workflow at all: the guest support and both partition images are
    # thousands of lines that no warnings-as-errors lane was looking at.
    #
    # Pinned to the same commit zx_fvp.yml pins, and for the same reason: an
    # unpinned guest means this workflow's results change when a different
    # repository does.  Change the two together.
    - name: Check out ThreadX, for the guest images
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: eclipse-threadx/threadx
        ref: 8c681c188ee748c777185e229024255c054a49d9
        path: threadx

    # The path and key match zx_fvp.yml's exactly so the two workflows share
    # one cache entry rather than each holding its own copy of the same archive.
    # Change them together or the sharing silently stops, and the only symptom
    # is a slower run.
    - name: Cache the AArch32 Arm GNU toolchain
      id: cache-arm32
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: toolchain
        key: arm-gnu-toolchain-${{ env.GCC_VERSION }}-x86_64-arm-none-eabi

    # The checksum suffix is .sha256asc and not .sha256.  Arm publishes both,
    # and for arm-none-eabi the .sha256 file contains a 32-character MD5, so
    # "sha256sum -c" on it fails with "no properly formatted checksum lines
    # found".  Do not "simplify" the suffix; ThreadX paid for this one.
    - name: Install the AArch32 Arm GNU toolchain
      if: steps.cache-arm32.outputs.cache-hit != 'true'
      run: |
        set -eu
        base="https://developer.arm.com/-/media/Files/downloads/gnu/${GCC_VERSION}/binrel"
        archive="arm-gnu-toolchain-${GCC_VERSION}-x86_64-arm-none-eabi.tar.xz"
        mkdir -p toolchain && cd toolchain
        curl -fsSLO "$base/$archive"
        curl -fsSLO "$base/$archive.sha256asc"
        sha256sum -c "$archive.sha256asc"
        tar xf "$archive"
        rm -f "$archive"

    # Only reaches apt if the runner image has stopped shipping ninja.  ZoneX
    # inherits ThreadX's rule about unguarded apt calls: scripts/install.sh
    # carries the long version of why, and it comes down to apt-get update
    # having stalled for over two hours and taken a whole run with it.  Do not
    # make this unconditional.
    - name: Ensure ninja is available
      run: |
        set -eu
        if command -v ninja >/dev/null 2>&1; then
          ninja --version
        else
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
        fi

    # Every configuration is configured and built by one loop, so that adding a
    # configuration is one line rather than a near-identical block of YAML.
    # The status is accumulated rather than allowed to abort, so one broken
    # configuration does not hide the state of the others.
    - name: Build every Cortex-R52 configuration
      run: |
        set -eu
        export PATH="$GITHUB_WORKSPACE/toolchain/arm-gnu-toolchain-${GCC_VERSION}-x86_64-arm-none-eabi/bin:$PATH"
        arm-none-eabi-gcc --version | head -1

        status=0

        build_configuration() {
          name="$1"; shift
          echo ""
          echo "=============================================================="
          echo "== $name"
          echo "=============================================================="
          if ! cmake -S . -B "build/$name" -G Ninja \
                  -DCMAKE_TOOLCHAIN_FILE=cmake/cortex_r52.cmake \
                  -DZX_THREADX_SOURCE_DIR="$GITHUB_WORKSPACE/threadx" \
                  -DCMAKE_COMPILE_WARNING_AS_ERROR=ON "$@"; then
            echo "::error::$name: CMake configure failed"
            status=1
            return
          fi
          if ! cmake --build "build/$name"; then
            echo "::error::$name: build failed"
            status=1
            return
          fi

          # The IMAGES as well.  They are EXCLUDE_FROM_ALL, as ThreadX's are,
          # so the build above reports "no work to do" for every one of them
          # and a compile error in an image would slip past this whole lane.
          #
          # Named from the generated ninja graph rather than from a list kept
          # here, so an image added to a CMakeLists.txt cannot escape the
          # check by nobody remembering to list it.
          local images
          images="$(ninja -C "build/$name" -t targets all 2>/dev/null \
                    | grep -oE '^[A-Za-z0-9_]+\.elf' \
                    | grep -v '^cmake_' | sort -u || true)"
          if [ -z "$images" ]; then
            echo "::error::$name: the CMake graph produced no images at all"
            status=1
            return
          fi
          echo "$name: building $(echo "$images" | wc -l) image(s)"
          # shellcheck disable=SC2086
          if ! cmake --build "build/$name" --target $images; then
            echo "::error::$name: an image failed to build"
            status=1
          fi
        }

        build_configuration fvp \
            -DZX_BUILD_FVP_EXAMPLE=ON -DZX_BUILD_S32Z280_EXAMPLE=OFF

        build_configuration s32z280 \
            -DZX_BUILD_FVP_EXAMPLE=OFF -DZX_BUILD_S32Z280_EXAMPLE=ON

        # Hard float is not a hypothetical lane.  ZoneX itself uses no floating
        # point at EL2, but a guest built hard-float cannot link against
        # soft-float objects, so the ABI has to keep working on both sides.
        build_configuration fvp-hardfloat \
            -DZX_BUILD_FVP_EXAMPLE=ON -DZX_BUILD_S32Z280_EXAMPLE=OFF \
            -DZX_R52_FLOAT_ABI=hard

        exit $status
