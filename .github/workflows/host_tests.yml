name: host_tests

# Builds and runs the ZoneX host unit-test suite, under the strict warning set
# with warnings as errors, and reports coverage.  Also runs the repository
# checks that need no toolchain.
#
# What this suite covers, and what it deliberately does not: it exercises the
# architecture-independent half of ZoneX -- the manifest and its validator, the
# partition tables, the schedule arithmetic.  It cannot cover stage-2
# programming, the trap path or isolation, and it does not pretend to; those
# are only true on the model and on silicon, and zx_fvp.yml is where they are
# checked.  See docs/decisions.md D11, which also records why ZoneX does not
# hold ThreadX's 99/100 coverage threshold over the whole repository.

on:
  # push as well as pull_request.  dev needs its own baseline so that a bad
  # squash-merge is caught then, rather than by whoever opens the next pull
  # request.  Both branches are named because both receive merges: dev during
  # the quarter, main at release.
  #
  # Getting these triggers wrong is not hypothetical.  ThreadX's
  # ci_cortex_m.yml ran on master only while dev was the integration branch,
  # so it gated no pull request anybody opened and the ports drifted unnoticed
  # for eight months.
  push:
    branches: [ dev, main ]
    paths:
      - ".github/workflows/host_tests.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "common/**"
      - "core/**"
      - "scripts/**"
      - "test/host/**"
  pull_request:
    branches: [ dev, main ]
    # Duplicated rather than shared through a YAML anchor.  GitHub Actions'
    # parser does not dependably honour anchors and the failure mode is the
    # whole workflow refusing to parse -- a job that dies before it does
    # anything, which is worse than the duplication.  **Edit both.**
    paths:
      - ".github/workflows/host_tests.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "common/**"
      - "core/**"
      - "scripts/**"
      - "test/host/**"

jobs:
  # Cheap, and independent of every toolchain, so it runs as its own job and
  # gives an unambiguous answer rather than being buried in a build log.
  terminology:
    runs-on: ubuntu-24.04
    steps:
    # Actions are pinned to a commit SHA with the version in the trailing
    # comment.  A tag can be moved; a SHA cannot, which is what makes "which
    # code ran in our CI" answerable from the repository -- something the
    # certification work needs on its own account.  Dependabot moves these pins
    # and rewrites the comments with them; see .github/dependabot.yml.
    - name: Check out the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check for A-profile and RISC-V terminology
      run: scripts/check_terminology.sh

    # Both checks run in the same job, and both run even if the first fails,
    # so that one push reports every finding rather than one per re-run.
    - name: Check for local paths and unreachable references
      if: '!cancelled()'
      run: scripts/check_references.sh

  host:
    runs-on: ubuntu-24.04
    steps:
    - name: Check out the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install the build and test dependencies
      run: scripts/install.sh

    # ci-strict rather than the default preset: CMAKE_COMPILE_WARNING_AS_ERROR
    # is on there, and the point of the strict warning set is that CI enforces
    # it while a developer build stays warning-tolerant.
    - name: Build and test, warnings as errors
      run: |
        set -eu
        cmake --preset ci-strict
        cmake --build --preset ci-strict
        ctest --preset ci-strict

    # A separate, instrumented build.  Coverage instrumentation changes code
    # generation, so the run that gates the pull request should not be the
    # instrumented one.
    - name: Coverage
      run: scripts/test_host.sh coverage

    - name: Upload the coverage report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage_report
        path: coverage_report/
        if-no-files-found: error
