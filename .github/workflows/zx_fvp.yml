name: zx_fvp

# Builds every ZoneX Cortex-R52 image and EXECUTES it on the Armv8-R AEM FVP,
# asserting each image's self-reported result.
#
# Why this exists from the first commit rather than from the step that needs
# it: ZoneX is a hypervisor, and there is no static check for "the partition
# still runs" or "the stage-2 fault still fires".  A change that assembles
# cleanly, links cleanly and then hangs at EL2 has to be caught by an execution
# test.  ThreadX added the equivalent workflow eight years into its life, after
# a period in which nothing in CI ran a single instruction of any port; ZoneX
# gets it while there is one image to run and the shape is cheap to set up.
#
# Modelled directly on threadx's .github/workflows/r52_fvp.yml, including the
# repository-variable arrangement for the model, because Arm has no stable
# unauthenticated download URL for it.
#
# WHAT IT RUNS.  Five families of image, and every one of them through CTest.
#
# The stage-2 probes: zx_probe.elf, which must PASS, plus builds of the same
# image that must FAIL -- a violation aimed at an address the payload is
# granted, a region budget claimed larger than any implementation has, a window
# widened by one granule, an overlapping manifest, an unwritten MAIR index, and
# a shared read-only granule given write permission to its READER.
#
# The one-partition images: a REAL ThreadX kernel booting at EL1 inside a
# stage-2 confined partition, one build that stops it at its stage-2 boundary,
# one that provokes a fault in its OWN stage-1 MPU, and one aimed at an address
# it genuinely owns -- which must FAIL, and whose failing is what makes the
# other two evidence.
#
# The preemptive images: the SAME guest, granted the virtual timer's PPI by a
# hypervisor that owns every byte of the GIC, being preempted by its own kernel
# under stage 2 -- plus two builds that must FAIL, one with the partition's
# interrupt left disabled in a frame the guest cannot reach, and one where the
# hypervisor does not give the partition back the time it spent descheduled.
#
# The two-partition images: two ThreadX kernels time-sharing one core under a
# static major frame, a HOSTILE build in which one of them masks its own
# interrupts and spins for ever and must be preempted anyway, a cross-partition
# build in which one reaches into the other's window and is stopped while its
# neighbour runs to the end of the frame untouched -- plus two that must FAIL.
#
# AND THE ISOLATION AND DETERMINISM REGRESSION, which is what this whole phase
# exists to produce: fourteen violation cases swept in one run, seven in each
# direction, each aimed at an address of its own; the critical partition's
# window period measured continuously while the untrusted one is steered
# through five behaviours; a build without the test-only continue mode that
# must halt on its first violation, which is how the SHIPPING fault policy is
# tested rather than assumed; and two builds that must FAIL -- a region limit
# one granule too generous, and the per-partition time freeze removed.
#
# It is the slowest lane here by a wide margin and that is deliberate: sixty
# major frames of simulated time with two kernels ticking through them, because
# a maximum period taken over ten periods is not a maximum.
#
# The builds that must fail are registered with the runner's "--expect fail",
# because a check that has never been seen to fail is not evidence that it can.
# (CTest's WILL_FAIL is deliberately NOT used: it inverts the exit status and
# nothing else, so it cannot tell a reported failure from an image that was
# never built.  See test/fvp/run_fvp_test.py.)
#
# THE GUEST NEEDS A THREADX CHECKOUT, so this workflow makes one.  ZoneX links
# no ThreadX -- at EL2 it is a standalone bare-metal program -- but the guest
# IS ThreadX, built as a separate program and embedded as a raw binary.  The
# checkout is pinned to a commit rather than to a branch: an unpinned guest
# would mean this suite's results changed when a different repository did, and
# a hypervisor regression is the last place to want that.
#
# zx_probe_el2_fault.elf is deliberately NOT registered: its expected outcome
# is a hypervisor-fault report, and a suite taught to accept that as a pass
# would accept it everywhere.  It is run by hand.
#
# The S32Z280 targets are not run here and never will be.  They need silicon;
# gcc_check.yml builds them, and
# examples/s32z280_evb/tools/run_zx_probe.sh runs them on a bench.

on:
  push:
    branches: [ dev, main ]
    paths:
      - ".github/workflows/zx_fvp.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "common/**"
      - "core/**"
      - "platform/**"
      - "examples/common/**"
      - "examples/guest_common/**"
      - "examples/fvp_baser_aemv8r/**"
      - "test/fvp/**"
  pull_request:
    branches: [ dev, main ]
    # Duplicated deliberately; see the note in host_tests.yml.  **Edit both.**
    paths:
      - ".github/workflows/zx_fvp.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "common/**"
      - "core/**"
      - "platform/**"
      - "examples/common/**"
      - "examples/guest_common/**"
      - "examples/fvp_baser_aemv8r/**"
      - "test/fvp/**"

jobs:
  fvp:
    runs-on: ubuntu-24.04

    env:
      # Matches gcc_check.yml so the two share one toolchain cache entry.
      GCC_VERSION: 14.3.rel1

      # The Armv8-R AEM FVP, from Arm's unauthenticated download permalink.
      # Only the _Linux_x86.tar.gz name resolves; the _Linux64.tgz name of
      # older releases returns 404.  The archive holds Arm's installer, which
      # refuses to run until its EULA is accepted, so the install step accepts
      # it.  The model is fetched from Arm on every cache miss and never
      # re-hosted.
      #
      # Pinned with its checksum so that a change of model is a reviewed diff.
      # Keep the version in step with the find_program hint in
      # examples/fvp_baser_aemv8r/CMakeLists.txt.
      FVP_URL: https://developer.arm.com/-/cdn-downloads/permalink/FVPs-Architecture/FM-11.32/FVP_Base_AEMv8R_11.32_19_Linux_x86.tar.gz
      FVP_SHA256: e6d046946529db86129ee6d8e7a2d5c3667d6c4c98365ad815586db8bca06613

    steps:
    - name: Check out the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # The kernel the GUEST images are built from.
    #
    # Pinned to a commit, not to a branch.  The alternative -- track dev --
    # would make this suite's verdict depend on a second repository's latest
    # state, so a ZoneX pull request could go red for a reason that had nothing
    # to do with it and everything to do with a kernel change landing that
    # morning.  Bumping the pin is then a deliberate, reviewable change with
    # its own diff, which is what upgrading a dependency should look like.
    #
    # The Cortex-R52 port has carried TX_R52_BOOT_AT_EL1 since it was written,
    # for exactly this case -- "an earlier boot stage or a vendor EL2 monitor
    # has already dropped privilege to EL1" -- so the guest needs no change to
    # the kernel or to its port.  ZoneX is that monitor.
    - name: Check out ThreadX, for the guest images
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: eclipse-threadx/threadx
        ref: 13c8c768c73b9ce10c9605f6df8b02080440f953
        path: threadx

    - name: Cache the AArch32 Arm GNU toolchain
      id: cache-arm32
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: toolchain
        key: arm-gnu-toolchain-${{ env.GCC_VERSION }}-x86_64-arm-none-eabi

    # .sha256asc, not .sha256; see gcc_check.yml.
    - name: Install the AArch32 Arm GNU toolchain
      if: steps.cache-arm32.outputs.cache-hit != 'true'
      run: |
        set -eu
        base="https://developer.arm.com/-/media/Files/downloads/gnu/${GCC_VERSION}/binrel"
        archive="arm-gnu-toolchain-${GCC_VERSION}-x86_64-arm-none-eabi.tar.xz"
        mkdir -p toolchain && cd toolchain
        curl -fsSLO "$base/$archive"
        curl -fsSLO "$base/$archive.sha256asc"
        sha256sum -c "$archive.sha256asc"
        tar xf "$archive"
        rm -f "$archive"

    - name: Ensure ninja is available
      run: |
        set -eu
        if command -v ninja >/dev/null 2>&1; then
          ninja --version
        else
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
        fi

    # Keyed on the archive's checksum, which changes exactly when the model
    # does.
    - name: Cache the Armv8-R AEM FVP
      id: cache-fvp
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: fvp
        key: fvp-aemv8r-${{ env.FVP_SHA256 }}

    - name: Install the Armv8-R AEM FVP
      if: steps.cache-fvp.outputs.cache-hit != 'true'
      run: |
        set -eu
        mkdir -p fvp-download
        curl -fsSL --retry 3 -o fvp-download/fvp.tar.gz "$FVP_URL"
        echo "$FVP_SHA256  fvp-download/fvp.tar.gz" | sha256sum -c -
        tar xzf fvp-download/fvp.tar.gz -C fvp-download
        sh fvp-download/FVP_Base_AEMv8R_*_Linux_x86.sh \
            --i-agree-to-the-contained-eula --no-interactive \
            -d "$GITHUB_WORKSPACE/fvp"
        rm -rf fvp-download

    # The model links against libatomic.  Everything else it needs is already
    # on the runner image, and its own libscxframework/libsystemc ship with
    # the model.  Guarded for the same reason the ninja step is.
    - name: Ensure the FVP's runtime dependencies are present
      run: |
        set -eu
        if ldconfig -p | grep -q 'libatomic\.so\.1'; then
          echo "libatomic1 present"
        else
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libatomic1
        fi

    # Resolve the model once and hand its absolute path to CMake below.
    #
    # examples/fvp_baser_aemv8r/CMakeLists.txt finds it with find_program and a
    # hint that is right on a developer's machine and meaningless here, so the
    # path is passed explicitly.  find_program caches into
    # ZX_FVP_BASER_AEMV8R, which means -DZX_FVP_BASER_AEMV8R=<path> overrides
    # it with no change to the CMake files.
    #
    # A missing binary fails here, rather than leaving CMake without a model
    # and CTest with no tests to run.
    - name: Locate the FVP
      id: fvp
      run: |
        set -eu
        binary="$(find fvp -type f -name FVP_BaseR_AEMv8R -perm -u+x | head -1)"
        if [ -z "$binary" ]; then
          echo "::error::The FVP install produced no FVP_BaseR_AEMv8R binary."
          find fvp -maxdepth 3 -type d | sed 's/^/  /' >&2
          exit 1
        fi
        binary="$(cd "$(dirname "$binary")" && pwd)/$(basename "$binary")"
        echo "binary=$binary" >>"$GITHUB_OUTPUT"
        "$binary" --version

    - name: Build and run the ZoneX images
      run: |
        set -eu
        export PATH="$GITHUB_WORKSPACE/toolchain/arm-gnu-toolchain-${GCC_VERSION}-x86_64-arm-none-eabi/bin:$PATH"
        arm-none-eabi-gcc --version | head -1

        fvp_binary='${{ steps.fvp.outputs.binary }}'

        cmake -S . -B build/fvp -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/cortex_r52.cmake \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DZX_BUILD_FVP_EXAMPLE=ON \
            -DZX_BUILD_S32Z280_EXAMPLE=OFF \
            -DZX_THREADX_SOURCE_DIR="$GITHUB_WORKSPACE/threadx" \
            -DZX_FVP_BASER_AEMV8R="$fvp_binary"

        cmake --build build/fvp

        # Every image is named from the generated ninja graph rather than from
        # a list kept here.  Images are EXCLUDE_FROM_ALL, so the build above
        # reports "no work to do" for them and would compare nothing; reading
        # the graph means an image added to CMakeLists.txt cannot escape this
        # check by nobody remembering to list it.
        images="$(ninja -C build/fvp -t targets all 2>/dev/null \
                  | grep -oE '^[A-Za-z0-9_]+\.elf' \
                  | grep -v '^cmake_' | sort -u || true)"

        # An ERROR, since the EL2 bring-up work landed.  This was a warning
        # while the repository genuinely had no images; from the moment the
        # first one exists, an empty list means the CMake graph broke, and a
        # workflow that shrugs at that is the hole this file exists to close.
        if [ -z "$images" ]; then
          echo "::error::No FVP images were found in the CMake graph. ZoneX has images, so this means the graph broke."
          {
            echo "### ZoneX FVP execution: NO IMAGES FOUND"
            echo ""
            echo "The hypervisor libraries built, but the ninja graph named no \`*.elf\` targets."
            echo "ZoneX does have FVP images, so this is a build-system failure rather than"
            echo "a repository that has not got there yet."
          } >>"$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        # AND THE GUEST IMAGES SPECIFICALLY.  Without a ThreadX checkout the
        # example CMakeLists SKIPS them, with a message -- which is right for a
        # contributor who has no kernel sources to hand and wrong here, where
        # it would mean half this suite quietly stopped running.  The stage-2
        # probes would still be green, and nothing would say that a real
        # kernel had not been booted at all.
        if ! echo "$images" | grep -qE '^zx_(one_partition|preemptive|regression)\.elf$'; then
          echo "::error::The ThreadX guest images were not built. ZX_THREADX_SOURCE_DIR did not reach CMake, so no real kernel was booted and half this suite did not run."
          {
            echo "### ZoneX FVP execution: NO GUEST IMAGES"
            echo ""
            echo "The stage-2 probe images built, but every image that boots a REAL ThreadX"
            echo "kernel inside a partition was skipped -- which happens when"
            echo "\`ZX_THREADX_SOURCE_DIR\` is empty. Check the ThreadX checkout step."
          } >>"$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        # EVERY guest family, named separately.  The check above catches a
        # missing ThreadX checkout, which removes them all together; this one
        # catches an image being dropped from the CMake graph on its own,
        # which would leave the suite green while a whole claim stopped being
        # tested.
        #
        # THE REGRESSION IS ON THIS LIST BECAUSE IT IS THE DELIVERABLE.  It is
        # also the image most likely to be dropped by accident: it is the
        # slowest lane by a wide margin, so it is the one somebody under time
        # pressure would reach for -- and its absence would leave every
        # isolation and determinism claim in this repository untested while
        # twenty other lanes stayed green.
        for required in zx_one_partition.elf zx_preemptive.elf \
                        zx_two_partitions.elf zx_regression.elf; do
          if ! echo "$images" | grep -qx "$required"; then
            echo "::error::$required is not in the CMake graph, so the claim it carries is no longer being tested."
            {
              echo "### ZoneX FVP execution: A GUEST IMAGE IS MISSING"
              echo ""
              echo "\`$required\` was not found among the targets. The rest of the suite would"
              echo "still be green, and nothing in it would say that the claim this image"
              echo "carries had stopped being tested."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        done

        echo "Building $(echo "$images" | wc -l) images"
        # shellcheck disable=SC2086
        cmake --build build/fvp --target $images

        # --no-tests=error, because ctest reports success when it finds
        # nothing to run.
        ctest --test-dir build/fvp --output-on-failure --no-tests=error
