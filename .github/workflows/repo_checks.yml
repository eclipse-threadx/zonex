name: repo_checks

# The two repository-wide checks: terminology, and references.
#
# THEY LIVE IN THEIR OWN WORKFLOW BECAUSE THEY MUST NOT BE PATH-FILTERED, and
# a path filter is a property of a workflow rather than of a job.  Both checks
# select their input with `git ls-files` and scan EVERY tracked file, so any
# file at all can carry a finding: a stale AArch64 register name in a design
# note, a local path in a build script, a citation of a document nobody else
# has.  A filter that skipped documentation would skip precisely the files
# whose prose these checks exist to police.
#
# They were part of host_tests.yml until this workflow existed, and that was
# measurably wrong rather than merely untidy.  host_tests.yml gates on
# common/, core/, scripts/, test/host/ and the build files -- so a change
# touching only docs/ and platform/ ran neither check.  A commit correcting
# twelve unpublishable references in docs/ and platform/ would have merged
# without either check running, which is the shape of hole that CONTRIBUTING.md
# warns about: a workflow that gates no pull request anybody opens is worse
# than no workflow, because it looks like coverage.
#
# Cheap enough that running them on everything costs nothing worth measuring:
# they are grep over a repository this size, and they need no toolchain, no
# build and no cache.

on:
  # No `paths:` on either trigger, deliberately.  See above.
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

# A second push to the same branch makes the first answer irrelevant.
concurrency:
  group: repo-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
    # Actions are pinned to a commit SHA with the version in the trailing
    # comment.  A tag can be moved; a SHA cannot, which is what makes "which
    # code ran in our CI" answerable from the repository -- something the
    # certification work needs on its own account.  Dependabot moves these
    # pins and rewrites the comments with them; see .github/dependabot.yml.
    - name: Check out the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check for A-profile and RISC-V terminology
      run: scripts/check_terminology.sh

    # Both checks run even if the first fails, so that one push reports every
    # finding rather than one per re-run.
    - name: Check for local paths and unreachable references
      if: '!cancelled()'
      run: scripts/check_references.sh
